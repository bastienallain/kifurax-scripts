<text x="190" y="214" fill="#6b6861" font-family="ui-monospace, 'Geist Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="22">#!/bin/bash</text>
<text x="190" y="290" fill="#3a3934" font-family="ui-monospace, 'Geist Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="22">brew install</text>
<text x="190" y="328" fill="#3a3934" font-family="ui-monospace, 'Geist Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="22">mise use --global</text>
