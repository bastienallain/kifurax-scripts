<line x1="652" y1="380" x2="668" y2="380" stroke="#e6e6e8" stroke-opacity=".45" stroke-width="1.2"/>
<text x="686" y="387" fill="#e6e6e8" fill-opacity=".72" font-family="ui-monospace, 'Geist Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="21">2  read it</text>
